# M5: T1 and T2 trained jointly (shared Emb_ID), CE only (+ L_bal), no distillation.
base: configs/base.yaml
model:
  heads: [t1, t2]
train:
  select_head: ens
loss:
  lambda_kd: 0.0               # no KD to the GRU in this milestone
  lambda_mut: 0.0             # no distillation in this milestone
