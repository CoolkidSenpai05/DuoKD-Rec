# BSARec. Source: github.com/yehjin-shin/BSARec src/utils.py defaults + README Beauty command
# (--lr 0.0005 --alpha 0.7 --c 5 --num_attention_heads 1). Used for every dataset (no per-dataset values published in the repo).
base: configs/base.yaml
model:
  name: bsarec
  hidden: 64                  # --hidden_size 64
  bsarec:
    num_hidden_layers: 2
    num_attention_heads: 1    # README Beauty
    hidden_act: gelu
    hidden_dropout_prob: 0.5
    attention_probs_dropout_prob: 0.5
    initializer_range: 0.02
    alpha: 0.7                # README Beauty (default 0.9)
    c: 5                      # README Beauty (default 3)
train:
  lr: 5.0e-4                  # README Beauty
  weight_decay: 0.0           # --weight_decay 0.0
  batch_size: 256             # --batch_size 256
  grad_clip: 0
  select_head: bsarec
search_space: {bsarec.alpha: [0.1, 0.3, 0.5, 0.7, 0.9], bsarec.c: [1, 3, 5, 7, 9], bsarec.num_attention_heads: [1, 2, 4], lr: [1.0e-3, 5.0e-4]}
