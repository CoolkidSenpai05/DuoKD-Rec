# UniSRec, transductive fine-tuning (ID + text), trained from scratch (no pre-training).
# Source: github.com/RUCAIBox/UniSRec props/UniSRec.yaml + props/finetune.yaml.
base: configs/base.yaml
model:
  name: unisrec
  hidden: 64                  # paper/repo 300 -> project D = 64
  unisrec:
    pretrain: false           # keep false: no pre-training on other data in this benchmark
    n_layers: 2
    n_heads: 2
    inner_size: 256
    hidden_dropout_prob: 0.5
    attn_dropout_prob: 0.5
    hidden_act: gelu
    layer_norm_eps: 1.0e-12
    initializer_range: 0.02
    adaptor_dropout_prob: 0.2
    n_exps: 8
    temperature: 0.07
train:
  lr: 1.0e-3                  # RecBole default (repo does not override for fine-tuning)
  weight_decay: 0.0
  batch_size: 2048            # RecBole default train_batch_size
  grad_clip: 0
  select_head: unisrec
search_space: {lr: [3.0e-4, 1.0e-3, 3.0e-3], unisrec.hidden_dropout_prob: [0.2, 0.5], unisrec.temperature: [0.05, 0.07, 0.1]}
