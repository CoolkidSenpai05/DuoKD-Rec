# DDMSR (text + image). Source: github.com/jluo00/DDMSR props/DDMSR.yaml + props/overall.yaml.
base: configs/base.yaml
model:
  name: ddmsr
  hidden: 64                  # repo 300 -> project D = 64
  ddmsr:
    n_layers: 2
    n_heads: 2
    inner_size: 256
    hidden_dropout_prob: 0.5
    attn_dropout_prob: 0.5
    hidden_act: gelu
    layer_norm_eps: 1.0e-12
    initializer_range: 0.02
    temperature: 0.07
    n_exps: 8
    adaptor_dropout_prob: 0.2 # MoEAdaptorLayer(..., 0.2) in ddmsr.py
    graph_denoise: true
    fusion_type: sum
    knn: 5
    g_layer: 2                # GraphFeatureDenoiser(..., 2) in ddmsr.py
    f_layer: 2
    filter_dropout: 0.5       # FrequencyFilter(..., 0.5) in ddmsr.py
    cl_weight: 0.1
    cl_temperature: 0.2       # info_nce(..., 0.2, sim='cos')
train:
  lr: 1.0e-3                  # overall.yaml learning_rate
  weight_decay: 0.0
  batch_size: 2048            # overall.yaml train_batch_size
  grad_clip: 0
  select_head: ddmsr
search_space: {ddmsr.knn: [5, 10, 20], ddmsr.f_layer: [1, 2, 3], ddmsr.cl_weight: [0.01, 0.1, 0.5], lr: [5.0e-4, 1.0e-3]}
