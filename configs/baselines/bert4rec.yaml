# BERT4Rec. Source: RecBole 1.2 properties/model/BERT4Rec.yaml (+ MaskItemSequence transform).
base: configs/base.yaml
model:
  name: bert4rec
  hidden: 64                  # RecBole hidden_size 64
  bert4rec:
    n_layers: 2
    n_heads: 2
    inner_size: 256
    hidden_dropout_prob: 0.2
    attn_dropout_prob: 0.2
    hidden_act: gelu
    layer_norm_eps: 1.0e-12
    initializer_range: 0.02
    mask_ratio: 0.2           # RecBole default (paper: 0.6 Beauty, 0.4 Steam, 0.2 ML) -> tune
    ft_ratio: 0.5             # RecBole: prob. of a "mask the last item" batch
train:
  lr: 1.0e-3
  weight_decay: 0.0
  batch_size: 2048
  grad_clip: 0
  select_head: bert4rec
search_space: {bert4rec.mask_ratio: [0.2, 0.4, 0.6], bert4rec.ft_ratio: [0.0, 0.5], lr: [1.0e-3, 5.0e-4]}
