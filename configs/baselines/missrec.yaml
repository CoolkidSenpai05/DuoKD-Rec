# MISSRec, transductive fine-tuning (ID + text + image), trained from scratch (no pre-training).
# Source: github.com/gimpong/MM23-MISSRec props/MISSRec.yaml + props/finetune.yaml.
base: configs/base.yaml
model:
  name: missrec
  hidden: 64                  # repo 300 -> project D = 64
  missrec:
    pretrain: false
    n_layers: 2               # 1 encoder + 1 decoder layer
    n_heads: 4
    inner_size: 256
    hidden_dropout_prob: 0.5
    attn_dropout_prob: 0.5    # (nn.Transformer uses a single dropout = hidden_dropout_prob)
    hidden_act: gelu
    layer_norm_eps: 1.0e-12
    initializer_range: 0.02
    temperature: 0.07
    gamma: 1.0e-4             # interest orthogonality weight
    interest_ratio: 0.5
train:
  lr: 1.0e-3                  # RecBole default
  weight_decay: 0.0
  batch_size: 512             # finetune.yaml train_batch_size
  grad_clip: 0
  select_head: missrec
search_space: {lr: [3.0e-4, 1.0e-3], missrec.interest_ratio: [0.1, 0.5], missrec.gamma: [0, 1.0e-4, 1.0e-3]}
