# TedRec (ID + text). Source: github.com/RUCAIBox/TedRec props/TedRec.yaml + props/overall.yaml.
base: configs/base.yaml
model:
  name: tedrec
  hidden: 64                  # repo 300 -> project D = 64
  tedrec:
    n_layers: 2
    n_heads: 2
    inner_size: 256
    hidden_dropout_prob: 0.5
    attn_dropout_prob: 0.5
    hidden_act: gelu
    layer_norm_eps: 1.0e-12
    initializer_range: 0.02
    adaptor_dropout_prob: 0.2
    n_exps: 8
    temperature: 0.07
train:
  lr: 1.0e-3
  weight_decay: 0.0
  batch_size: 2048
  grad_clip: 0
  select_head: tedrec
search_space: {lr: [3.0e-4, 1.0e-3, 3.0e-3], tedrec.hidden_dropout_prob: [0.2, 0.5], tedrec.n_exps: [4, 8]}
