# DuoKD-Rec base config. Every hyper-parameter lives here (CLAUDE.md §11).
seed: 42

data:
  # dataset name -> configs/datasets/<name>.yaml fills raw/processed/feature/image/run paths
  # (beauty | sports | toys | clothing); paths set explicitly here or via --set take precedence.
  dataset: beauty
  limit_users: null            # smoke runs only: keep the first K users (catalog unchanged)
  k_core: 5
  max_len: 50

features:
  text_model: bert-base-uncased
  text_pooling: cls            # cls | mean
  text_max_tokens: 128
  desc_max_chars: 300          # description truncated before tokenization
  image_model: google/vit-base-patch16-224-in21k
  missing: zeros               # zeros | mean  (vector used for items missing a modality)
  batch_size: 128
  download_workers: 16

model:
  name: duokd                  # sasrec | duokd
  heads: [t1, t2, gru]         # active networks: t1 (text view), t2 (image view), gru (student)
  score_against: own           # own | id  (id: every head scores against Emb_ID, ablation)
  gru_detach_shared: true
  ens_weights: [0.5, 0.5]
  learned_ens_weights: false   # true: w = softmax(a), a trained by CE(z_ens) only
  t2_input: E_v                # E_v | E_f  (ablation: T2 reads the fused view h_f)
  hidden: 64
  dropout: 0.2                 # embedding / attention / FFN dropout (not fixed by spec)
  transformer:
    n_layers: 2
    n_heads: 2
    ffn_mult: 4
  gru:
    n_layers: 2

train:
  epochs: 200
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-2
  grad_clip: 5.0
  patience: 10                 # early stop on valid NDCG@20 (epochs without improvement)
  eval_every: 1
  select_metric: NDCG@20
  select_head: gru             # head used for checkpoint selection (sasrec for baseline)
  num_workers: 2

eval:
  batch_size: 1024
  ks: [10, 20]
  mrr: true
  exclude_history: true
  cold_user_max_len: 5         # users whose input history length <= this are "cold"
  cold_item_max_freq: 10       # target items with <= this many train interactions are "cold"

# item encoder (M4)
item_encoder:
  modality_dropout: 0.1        # prob. of replacing an item's text / image feature by the "missing" vector
  fusion_out_proj: true        # GRU-branch-only Linear after the fusion gate
  use_text: true               # ablation: false -> e_txt = 0 for every item
  use_image: true              # ablation: false -> e_img = 0 for every item
  moe:
    n_experts: 4
    expert_hidden: 128
    top_k: null                # null = soft MoE
    plain_mlp: false           # ablation: single MLP instead of MoE

loss:
  lambda_bal: 0.01
  tau: 2.0
  lambda_mut: 0.3              # max value; linear warm-up from 0
  mut_start_epoch: 5
  mut_warmup_epochs: 5
  lambda_kd: 1.0               # max value; linear warm-up from 0
  kd_start_epoch: 5
  kd_warmup_epochs: 5
  kd_teacher: ens              # ens | t1 | t2  (teacher distilled into the GRU)

# ablation runner (M10, scripts/run_ablation.py)
ablation:
  seeds: [42, 43, 44]
  parallel: 3                  # concurrent training processes on the GPU
  metrics: [Recall@10, Recall@20, NDCG@10, NDCG@20, MRR, cold_user/NDCG@20, cold_item/NDCG@20]

# latency / memory benchmark (M10, scripts/benchmark.py)
bench:
  batch_sizes: [1, 256]
  warmup_iters: 100
  iters: 200
  devices: [cuda, cpu]
