# DuoKD-Rec base config. Every hyper-parameter lives here (CLAUDE.md §11).
seed: 42

data:
  dataset: Beauty
  raw_dir: data/raw
  reviews_file: reviews_Beauty_5.json.gz
  meta_file: meta_Beauty.json.gz
  processed_dir: data/processed/Beauty
  k_core: 5
  max_len: 50

features:
  feat_dir: data/processed/Beauty/feats
  image_dir: data/raw/images/Beauty
  text_model: bert-base-uncased
  text_pooling: cls            # cls | mean
  text_max_tokens: 128
  desc_max_chars: 300          # description truncated before tokenization
  image_model: google/vit-base-patch16-224-in21k
  missing: zeros               # zeros | mean  (vector used for items missing a modality)
  batch_size: 128
  download_workers: 16

model:
  name: duokd                  # sasrec | duokd
  heads: [t1, t2]              # active networks: t1 (text view), t2 (image view), gru (student, M6)
  score_against: own           # own | id  (id: every head scores against Emb_ID, ablation)
  gru_detach_shared: true
  ens_weights: [0.5, 0.5]
  hidden: 64
  dropout: 0.2                 # embedding / attention / FFN dropout (not fixed by spec)
  transformer:
    n_layers: 2
    n_heads: 2
    ffn_mult: 4

train:
  epochs: 200
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 1.0e-2
  grad_clip: 5.0
  patience: 10                 # early stop on valid NDCG@20 (epochs without improvement)
  eval_every: 1
  select_metric: NDCG@20
  select_head: gru             # head used for checkpoint selection (sasrec for baseline)
  num_workers: 2
  out_dir: runs

eval:
  batch_size: 1024
  ks: [10, 20]
  mrr: true
  exclude_history: true
  cold_user_max_len: 5         # users whose input history length <= this are "cold"
  cold_item_max_freq: 10       # target items with <= this many train interactions are "cold"

# item encoder (M4)
item_encoder:
  modality_dropout: 0.1        # prob. of replacing an item's text / image feature by the "missing" vector
  fusion_out_proj: true        # GRU-branch-only Linear after the fusion gate
  moe:
    n_experts: 4
    expert_hidden: 128
    top_k: null                # null = soft MoE
    plain_mlp: false           # ablation: single MLP instead of MoE

loss:
  lambda_bal: 0.01
